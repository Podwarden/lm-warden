<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 704" width="340" height="704" role="img" style="font-family:var(--sans, ui-sans-serif, system-ui, sans-serif);font-size:13px"><title>Why affinity: one conversation over four turns</title><desc>Two panels of four replicas. First: each of four turns of one conversation lands on a different replica and is almost entirely prefilled from scratch. Second: all four turns stay on one replica and only the new turn is prefilled; the rest is served from the prefix cache.</desc><rect x="0" y="4" width="14" height="10" style="fill:var(--ink-2);opacity:.35"/><text x="22" y="13" text-anchor="start" style="fill:var(--ink-2)">served from the prefix cache</text><rect x="0" y="23.5" width="14" height="10" style="fill:var(--ink)"/><text x="22" y="32.5" text-anchor="start" style="fill:var(--ink-2)">prefilled from scratch</text><text x="0" y="63.7" text-anchor="start" style="fill:var(--ink);font-weight:600">vLLM’s balancer: a turn lands anywhere</text><text x="0" y="112" text-anchor="start" style="fill:var(--ink-2)">replica 0</text><line x1="68" x2="340" y1="134.7" y2="134.7" style="stroke:var(--rule);stroke-width:1"/><text x="0" y="174" text-anchor="start" style="fill:var(--ink-2)">replica 1</text><line x1="68" x2="340" y1="196.7" y2="196.7" style="stroke:var(--rule);stroke-width:1"/><text x="0" y="236" text-anchor="start" style="fill:var(--ink-2)">replica 2</text><line x1="68" x2="340" y1="258.7" y2="258.7" style="stroke:var(--rule);stroke-width:1"/><text x="0" y="298" text-anchor="start" style="fill:var(--ink-2)">replica 3</text><line x1="68" x2="340" y1="320.7" y2="320.7" style="stroke:var(--rule);stroke-width:1"/><rect x="68" y="204.7" width="24.6" height="9" style="fill:var(--ink-2);opacity:.35"/><rect x="94.6" y="204.7" width="71.8" height="9" style="fill:var(--ink)"/><text x="172.4" y="212.7" text-anchor="start" style="fill:var(--ink-2)">t1</text><rect x="68" y="93.7" width="24.6" height="9" style="fill:var(--ink-2);opacity:.35"/><rect x="94.6" y="93.7" width="108.7" height="9" style="fill:var(--ink)"/><text x="209.3" y="101.7" text-anchor="start" style="fill:var(--ink-2)">t2</text><rect x="68" y="292.7" width="24.6" height="9" style="fill:var(--ink-2);opacity:.35"/><rect x="94.6" y="292.7" width="150.5" height="9" style="fill:var(--ink)"/><text x="251.1" y="300.7" text-anchor="start" style="fill:var(--ink-2)">t3</text><rect x="68" y="181.7" width="24.6" height="9" style="fill:var(--ink-2);opacity:.35"/><rect x="94.6" y="181.7" width="199.7" height="9" style="fill:var(--ink)"/><text x="300.3" y="189.7" text-anchor="start" style="fill:var(--ink-2)">t4</text><text x="0" y="342.9" text-anchor="start" style="fill:var(--ink-2)">prefilled again: about the whole history,</text><text x="0" y="360.4" text-anchor="start" style="fill:var(--ink-2)">every turn</text><text x="0" y="404" text-anchor="start" style="fill:var(--ink);font-weight:600">LM Warden: a conversation stays on its replica</text><text x="0" y="452.3" text-anchor="start" style="fill:var(--ink-2)">replica 0</text><line x1="68" x2="340" y1="475" y2="475" style="stroke:var(--rule);stroke-width:1"/><text x="0" y="514.3" text-anchor="start" style="fill:var(--ink-2)">replica 1</text><line x1="68" x2="340" y1="537" y2="537" style="stroke:var(--rule);stroke-width:1"/><text x="0" y="576.3" text-anchor="start" style="fill:var(--ink-2)">replica 2</text><line x1="68" x2="340" y1="599" y2="599" style="stroke:var(--rule);stroke-width:1"/><text x="0" y="638.3" text-anchor="start" style="fill:var(--ink-2)">replica 3</text><line x1="68" x2="340" y1="661" y2="661" style="stroke:var(--rule);stroke-width:1"/><rect x="68" y="545" width="24.6" height="9" style="fill:var(--ink-2);opacity:.35"/><rect x="94.6" y="545" width="71.8" height="9" style="fill:var(--ink)"/><text x="172.4" y="553" text-anchor="start" style="fill:var(--ink-2)">t1</text><rect x="68" y="558" width="98.4" height="9" style="fill:var(--ink-2);opacity:.35"/><rect x="168.4" y="558" width="34.9" height="9" style="fill:var(--ink)"/><text x="209.3" y="566" text-anchor="start" style="fill:var(--ink-2)">t2</text><rect x="68" y="571" width="135.3" height="9" style="fill:var(--ink-2);opacity:.35"/><rect x="205.3" y="571" width="39.8" height="9" style="fill:var(--ink)"/><text x="251.1" y="579" text-anchor="start" style="fill:var(--ink-2)">t3</text><rect x="68" y="584" width="177.1" height="9" style="fill:var(--ink-2);opacity:.35"/><rect x="247.1" y="584" width="47.2" height="9" style="fill:var(--ink)"/><text x="300.3" y="592" text-anchor="start" style="fill:var(--ink-2)">t4</text><text x="0" y="683.2" text-anchor="start" style="fill:var(--ink-2)">prefilled again: only the new turn</text></svg>
