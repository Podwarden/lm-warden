<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 402" width="980" height="402" role="img" style="font-family:var(--sans, ui-sans-serif, system-ui, sans-serif);font-size:14px"><title>Why affinity: one conversation over four turns</title><desc>Two panels of four replicas. First: each of four turns of one conversation lands on a different replica and is almost entirely prefilled from scratch. Second: all four turns stay on one replica and only the new turn is prefilled; the rest is served from the prefix cache.</desc><rect x="0" y="5" width="14" height="10" style="fill:var(--ink-2);opacity:.35"/><text x="22" y="14" text-anchor="start" style="fill:var(--ink-2)">served from the prefix cache</text><rect x="240" y="5" width="14" height="10" style="fill:var(--ink)"/><text x="262" y="14" text-anchor="start" style="fill:var(--ink-2)">prefilled from scratch</text><text x="0" y="50.4" text-anchor="start" style="fill:var(--ink);font-weight:600">vLLM’s balancer: a turn lands anywhere</text><text x="0" y="106" text-anchor="start" style="fill:var(--ink-2)">replica 0</text><line x1="70" x2="470" y1="134.4" y2="134.4" style="stroke:var(--rule);stroke-width:1"/><text x="0" y="180" text-anchor="start" style="fill:var(--ink-2)">replica 1</text><line x1="70" x2="470" y1="208.4" y2="208.4" style="stroke:var(--rule);stroke-width:1"/><text x="0" y="254" text-anchor="start" style="fill:var(--ink-2)">replica 2</text><line x1="70" x2="470" y1="282.4" y2="282.4" style="stroke:var(--rule);stroke-width:1"/><text x="0" y="328" text-anchor="start" style="fill:var(--ink-2)">replica 3</text><line x1="70" x2="470" y1="356.4" y2="356.4" style="stroke:var(--rule);stroke-width:1"/><rect x="70" y="216.4" width="37.2" height="11" style="fill:var(--ink-2);opacity:.35"/><rect x="109.2" y="216.4" width="109.6" height="11" style="fill:var(--ink)"/><text x="224.8" y="226.4" text-anchor="start" style="fill:var(--ink-2)">t1</text><rect x="70" y="84.4" width="37.2" height="11" style="fill:var(--ink-2);opacity:.35"/><rect x="109.2" y="84.4" width="165.4" height="11" style="fill:var(--ink)"/><text x="280.6" y="94.4" text-anchor="start" style="fill:var(--ink-2)">t2</text><rect x="70" y="322.4" width="37.2" height="11" style="fill:var(--ink-2);opacity:.35"/><rect x="109.2" y="322.4" width="228.6" height="11" style="fill:var(--ink)"/><text x="343.8" y="332.4" text-anchor="start" style="fill:var(--ink-2)">t3</text><rect x="70" y="190.4" width="37.2" height="11" style="fill:var(--ink-2);opacity:.35"/><rect x="109.2" y="190.4" width="303" height="11" style="fill:var(--ink)"/><text x="418.2" y="200.4" text-anchor="start" style="fill:var(--ink-2)">t4</text><text x="0" y="380" text-anchor="start" style="fill:var(--ink-2)">prefilled again: about the whole history, every turn</text><text x="510" y="50.4" text-anchor="start" style="fill:var(--ink);font-weight:600">LM Warden: a conversation stays on its replica</text><text x="510" y="106" text-anchor="start" style="fill:var(--ink-2)">replica 0</text><line x1="580" x2="980" y1="134.4" y2="134.4" style="stroke:var(--rule);stroke-width:1"/><text x="510" y="180" text-anchor="start" style="fill:var(--ink-2)">replica 1</text><line x1="580" x2="980" y1="208.4" y2="208.4" style="stroke:var(--rule);stroke-width:1"/><text x="510" y="254" text-anchor="start" style="fill:var(--ink-2)">replica 2</text><line x1="580" x2="980" y1="282.4" y2="282.4" style="stroke:var(--rule);stroke-width:1"/><text x="510" y="328" text-anchor="start" style="fill:var(--ink-2)">replica 3</text><line x1="580" x2="980" y1="356.4" y2="356.4" style="stroke:var(--rule);stroke-width:1"/><rect x="580" y="216.4" width="37.2" height="11" style="fill:var(--ink-2);opacity:.35"/><rect x="619.2" y="216.4" width="109.6" height="11" style="fill:var(--ink)"/><text x="734.8" y="226.4" text-anchor="start" style="fill:var(--ink-2)">t1</text><rect x="580" y="232.4" width="148.8" height="11" style="fill:var(--ink-2);opacity:.35"/><rect x="730.8" y="232.4" width="53.8" height="11" style="