<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 403" width="640" height="403" role="img" style="font-family:var(--sans, ui-sans-serif, system-ui, sans-serif);font-size:15px"><title>Prefix-cache hit rate by concurrent sessions</title><desc>Share of prompt tokens served from the prefix cache in each step, all four replicas pooled, affinity on against vLLM’s balancer: 4 sessions 56.2% off, 86.4% on; 8 sessions 44.3% off, 86.1% on; 16 sessions 33.2% off, 48.6% on; 24 sessions 32.8% off, 37.9% on; 32 sessions 31.6% off, 31.6% on.</desc><line x1="0" x2="26" y1="15" y2="15" style="stroke:var(--series-on);stroke-width:2.5"/><circle cx="13" cy="15" r="5" style="fill:var(--series-on);stroke:var(--paper);stroke-width:2"></circle><text x="34" y="19.9" text-anchor="start" style="fill:var(--ink)">affinity on</text><line x1="150" x2="176" y1="15" y2="15" style="stroke:var(--series-off);stroke-width:2.5"/><rect x="158.5" y="10.5" width="9" height="9" style="fill:var(--series-off);stroke:var(--paper);stroke-width:2"></rect><text x="184" y="19.9" text-anchor="start" style="fill:var(--ink)">vLLM balancer</text><text x="0" y="54" text-anchor="start" style="fill:var(--ink);font-weight:600">Prefix-cache hit rate</text><line x1="43.5" x2="529" y1="352.5" y2="352.5" style="stroke:var(--rule);stroke-width:1"/><text x="35.5" y="357.4" text-anchor="end" style="fill:var(--ink-2)">0</text><line x1="43.5" x2="529" y1="286.9" y2="286.9" style="stroke:var(--rule);stroke-width:1"/><text x="35.5" y="291.8" text-anchor="end" style="fill:var(--ink-2)">25</text><line x1="43.5" x2="529" y1="221.2" y2="221.2" style="stroke:var(--rule);stroke-width:1"/><text x="35.5" y="226.2" text-anchor="end" style="fill:var(--ink-2)">50</text><line x1="43.5" x2="529" y1="155.6" y2="155.6" style="stroke:var(--rule);stroke-width:1"/><text x="35.5" y="160.6" text-anchor="end" style="fill:var(--ink-2)">75</text><line x1="43.5" x2="529" y1="90" y2="90" style="stroke:var(--rule);stroke-width:1"/><text x="35.5" y="95" text-anchor="end" style="fill:var(--ink-2)">100</text><text x="0" y="76.5" text-anchor="start" style="fill:var(--ink-2)">% of prompt tokens</text><text x="92" y="372.8" text-anchor="middle" style="fill:var(--ink-2)">4</text><text x="189.2" y="372.8" text-anchor="middle" style="fill:var(--ink-2)">8</text><text x="286.2" y="372.8" text-anchor="middle" style="fill:var(--ink-2)">16</text><text x="383.4" y="372.8" text-anchor="middle" style="fill:var(--ink-2)">24</text><text x="480.4" y="372.8" text-anchor="middle" style="fill:var(--ink-2)">32</text><text x="286.2" y="395.2" text-anchor="middle" style="fill:var(--ink-2)">concurrent sessions</text><polyline points="92,205 189.2,236.2 286.2,265.4 383.4,266.4 480.4,269.6" style="fill:none;stroke:var(--series-off);stroke-width:2.5;stroke-linejoin:round"/><rect x="87.5" y="200.5" width="9" height="9" style="fill:var(--series-off);stroke:var(--paper);stroke-width:2"><title>vLLM balancer, 4 sessions: 56.2%</title></rect><rect x="184.7" y="231.7" width="9" height="9" style="fill:var(--series-off);stroke:var(--paper);stroke-width:2"><title>vLLM balancer, 8 sessions: 44.3%</title></rect><rect x="281.8" y="260.9" width="9" height="9" style="fill:var(--series-off);stroke:var(--paper);stroke-width:2"><title>vLLM balancer, 16 sessions: 33.2%</title></rect><rect x="378.9" y="261.9" width="9" height="9" style="fill:var(--series-off);stroke:var(--paper);stroke-width:2"><title>vLLM balancer, 24 sessions: 32.8%</title></rect><rect x="475.9" y="265.1" width="9" height="9" style="fill:var(--series-off);stroke:var(--paper);stroke-width:2"><title>vLLM balancer, 32 sessions: 31.6%</title></rect><text x="492.4" y="265.1" text-anchor="start" style="fill:var(--ink)">vLLM balancer</text><polyline points="92,125.7 189.2,126.5 286.2,224.9 383.4,253 480.4,269.6" style="fill:none;stroke:var(--series-on);stroke-width:2.5;stroke-linejoin:round"/><circle cx="92" cy="125.7" r="5" style="fill:var(--series-on);stroke:var(--paper);stroke-width:2"><title>affinity on, 4 sessions: 86.4%</title></circle><circle cx="189.2" cy="126.5" r="5" style="fill:var(--series-on);stroke:var(--paper);stroke-width:2"><title>affinity on, 8 sessions: 86.1%</title></circle><circle cx="286.2" cy="224.9" r="5" style="fill:var(--series-on);stroke:var(--paper);stroke-width:2"><title>affinity on, 16 sessions: 48.6%</title></circle><circle cx="383.4" cy="253" r="5" style="fill:var(--series-on);stroke:var(--paper);stroke-width:2"><title>affinity on, 24 sessions: 37.9%</title></circle><circle cx="480.4" cy="269.6" r="5" style="fill:var(--series-on);stroke:var(--paper);stroke-width:2"><title>affinity on, 32 sessions: 31.6%</title></circle><text x="492.4" y="283.9" text-anchor="start" style="fill:var(--ink)">affinity on</text></svg>
