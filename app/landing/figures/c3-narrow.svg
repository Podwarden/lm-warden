<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 367" width="340" height="367" role="img" style="font-family:var(--sans, ui-sans-serif, system-ui, sans-serif);font-size:13px"><title>Prefix-cache hit rate by concurrent sessions</title><desc>Share of prompt tokens served from the prefix cache in each step, all four replicas pooled, affinity on against vLLM’s balancer: 4 sessions 56.2% off, 86.4% on; 8 sessions 44.3% off, 86.1% on; 16 sessions 33.2% off, 48.6% on; 24 sessions 32.8% off, 37.9% on; 32 sessions 31.6% off, 31.6% on.</desc><line x1="0" x2="26" y1="13" y2="13" style="stroke:var(--series-on);stroke-width:2.5"/><circle cx="13" cy="13" r="5" style="fill:var(--series-on);stroke:var(--paper);stroke-width:2"></circle><text x="34" y="17.3" text-anchor="start" style="fill:var(--ink)">affinity on</text><line x1="130" x2="156" y1="13" y2="13" style="stroke:var(--series-off);stroke-width:2.5"/><rect x="138.5" y="8.5" width="9" height="9" style="fill:var(--series-off);stroke:var(--paper);stroke-width:2"></rect><text x="164" y="17.3" text-anchor="start" style="fill:var(--ink)">vLLM balancer</text><text x="0" y="46.8" text-anchor="start" style="fill:var(--ink);font-weight:600">Prefix-cache hit rate</text><line x1="37.7" x2="243.8" y1="323.5" y2="323.5" style="stroke:var(--rule);stroke-width:1"/><text x="29.7" y="327.8" text-anchor="end" style="fill:var(--ink-2)">0</text><line x1="37.7" x2="243.8" y1="262.1" y2="262.1" style="stroke:var(--rule);stroke-width:1"/><text x="29.7" y="266.4" text-anchor="end" style="fill:var(--ink-2)">25</text><line x1="37.7" x2="243.8" y1="200.8" y2="200.8" style="stroke:var(--rule);stroke-width:1"/><text x="29.7" y="205" text-anchor="end" style="fill:var(--ink-2)">50</text><line x1="37.7" x2="243.8" y1="139.4" y2="139.4" style="stroke:var(--rule);stroke-width:1"/><text x="29.7" y="143.7" text-anchor="end" style="fill:var(--ink-2)">75</text><line x1="37.7" x2="243.8" y1="78" y2="78" style="stroke:var(--rule);stroke-width:1"/><text x="29.7" y="82.3" text-anchor="end" style="fill:var(--ink-2)">100</text><text x="0" y="66.3" text-anchor="start" style="fill:var(--ink-2)">% of prompt tokens</text><text x="58.3" y="341.1" text-anchor="middle" style="fill:var(--ink-2)">4</text><text x="99.5" y="341.1" text-anchor="middle" style="fill:var(--ink-2)">8</text><text x="140.8" y="341.1" text-anchor="middle" style="fill:var(--ink-2)">16</text><text x="182" y="341.1" text-anchor="middle" style="fill:var(--ink-2)">24</text><text x="223.2" y="341.1" text-anchor="middle" style="fill:var(--ink-2)">32</text><text x="140.8" y="360.6" text-anchor="middle" style="fill:var(--ink-2)">concurrent sessions</text><polyline points="58.3,185.5 99.5,214.7 140.8,242 182,243 223.2,245.9" style="fill:none;stroke:var(--series-off);stroke-width:2.5;stroke-linejoin:round"/><rect x="53.8" y="181" width="9" height="9" style="fill:var(--series-off);stroke:var(--paper);stroke-width:2"><title>vLLM balancer, 4 sessions: 56.2%</title></rect><rect x="95" y="210.2" width="9" height="9" style="fill:var(--series-off);stroke:var(--paper);stroke-width:2"><title>vLLM balancer, 8 sessions: 44.3%</title></rect><rect x="136.2" y="237.5" width="9" height="9" style="fill:var(--series-off);stroke:var(--paper);stroke-width:2"><title>vLLM balancer, 16 sessions: 33.2%</title></rect><rect x="177.5" y="238.5" width="9" height="9" style="fill:var(--series-off);stroke:var(--paper);stroke-width:2"><title>vLLM balancer, 24 sessions: 32.8%</title></rect><rect x="218.7" y="241.4" width="9" height="9" style="fill:var(--series-off);stroke:var(--paper);stroke-width:2"><title>vLLM balancer, 32 sessions: 31.6%</title></rect><text x="235.2" y="242.1" text-anchor="start" style="fill:var(--ink)">vLLM balancer</text><polyline points="58.3,111.4 99.5,112.1 140.8,204.2 182,230.5 223.2,245.9" style="fill:none;stroke:var(--series-on);stroke-width:2.5;stroke-linejoin:round"/><circle cx="58.3" cy="111.4" r="5" style="fill:var(--series-on);stroke:var(--paper);stroke-width:2"><titl