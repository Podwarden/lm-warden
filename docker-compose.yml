services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # #155 unified-port: api is no longer host-published. Caddy fronts both
    # api and ui on :8080. `expose` keeps the port reachable on the internal
    # compose network so Caddy can `reverse_proxy api:8080` without any
    # host-side mapping.
    expose: ["8080"]
    # Share the host PID namespace so /api/system/gpus can attribute
    # nvidia-smi compute holders (host PIDs) to supervisor-tracked vLLM
    # processes. Without this, supervisor stores in-container PIDs and
    # attribution silently falls back to kind: external. See vllm-warden#42.
    pid: host
    # /dev/shm for the engines and the KV-cache RAM tier (docs/operating.md,
    # "KV-cache tiers"). Tensor-parallel engines need at least 2 GiB. The RAM
    # tier's pool lives here too: the store daemon sizes it to the free space
    # minus 2 GiB (kept for the engines), so 20gb holds the default 16 GiB
    # tier. /dev/shm is RAM and counts against the container's memory: lower
    # this on a small host, and set kv_store_ram_gib to match.
    shm_size: "20gb"
    environment:
      VW_JWT_SECRET: ""
      # The origin(s) every state-changing browser request must come from
      # (app/auth/csrf.py). Blank = the address the request arrived at, which
      # serves localhost, a LAN IP and a hostname alike; pinning one here
      # (e.g. http://localhost:8080) refuses every UI change made from any
      # other address. Accepts a comma-separated allow-list of exact origins.
      VW_FRONTEND_ORIGIN: "${VW_FRONTEND_ORIGIN:-}"
      # Behind a trusted reverse proxy that sets X-Forwarded-Proto/-Host,
      # set this to 1 to also accept the proxy-derived origin (so a reload
      # doesn't log the user out when the public URL isn't pinned above).
      # Off by default — only enable when a trusted proxy fronts the warden.
      # VW_TRUST_PROXY_ORIGIN: "1"
      # First run (app/setup/bootstrap.py): the setup wizard's one-time
      # code, or an unattended first admin. Blank code = the server makes one
      # and prints it in its log (and /data/setup-code).
      LM_SETUP_CODE: "${LM_SETUP_CODE:-}"
      LM_BOOTSTRAP_ADMIN_USERNAME: "${LM_BOOTSTRAP_ADMIN_USERNAME:-}"
      LM_BOOTSTRAP_ADMIN_PASSWORD: "${LM_BOOTSTRAP_ADMIN_PASSWORD:-}"
      # Daily check of lmwarden.com for new releases and security advisories
      # (sends version, edition, platform, random install ID). 0 = off.
      VW_UPDATE_CHECK: "${VW_UPDATE_CHECK:-}"
    volumes:
      - vw-data:/data
      - vw-hfcache:/root/.cache/huggingface
      # KV-cache NVMe tier: point VW_KV_DIR at the mount point of a dedicated
      # local disk, then set the runtime setting kv_store_nvme_dir to /kv.
      - ${VW_KV_DIR:-/var/lib/lmw-kv}:/kv
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # #155 unified-port: ui is no longer host-published either; Caddy
    # proxies /ui/* and /_next/* to ui:3000 over the compose network.
    expose: ["3000"]
    depends_on: [api]

  # #155 — Caddy reverse-proxy front-door. Only host-published port in
  # the stack. See deploy/caddy/Caddyfile for the routing map.
  caddy:
    # Pinned, not floating: Caddy 2.11 changed a server timeout default
    # (read_body_idle, see deploy/caddy/Caddyfile) and cut every stream at
    # 60 s on a plain restart. Bump deliberately and re-test long streams.
    image: caddy:2.11.6-alpine
    ports: ["8080:8080"]
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, ui]
    restart: unless-stopped

volumes:
  vw-data:
  vw-hfcache:
  caddy-data:
  caddy-config:
